[package]
name = "flow"
version = "2.6.4"
edition = "2021"
rust-version = "1.85"
resolver = "3"
license = "GPL-3.0-or-later"
description = "Flow: a Trindle plugin that shares one computer's mouse and keyboard with another, with the clipboard and files shared"
repository = "https://github.com/trindle-os/trindle-flow"

[[bin]]
name = "flow"
path = "src/main.rs"

[dependencies]
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
trindle-common = { git = "https://github.com/trindle-os/trindle-toolkit", rev = "3b1e06bc4d4ccb94b9d7b876feecc37aa4765e74" }
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = "0.14"
spake2 = "0.4"
ring = "0.17"
wayland-scanner = "0.31"


[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
