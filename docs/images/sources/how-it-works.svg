  <text x="496" y="200" font-family="Trindle Sans, DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#f4f6fb">Pair them</text>
  <text x="496" y="244" font-family="Trindle Sans, DejaVu Sans, sans-serif" font-size="22" fill="#b8c0d0">Type the four-digit number</text>
